# Browser play: the released public game (www/) on GitHub Pages, unchanged.
# 1. www/ = the released game byte for byte (www-manifest.json): the servers' anti-cheat compares every player's files with their own
# 2. www/ published as the site (no Jekyll: an Actions deployment serves the files as they are)
name: Browser play (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: www is the released game
        run: node tools/check-www.cjs check www www-manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
